<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="How a Banner job runs">
<title>How a Banner job runs</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11b89b"/></marker>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13213d"/><stop offset="1" stop-color="#0a1324"/></linearGradient>
</defs>
<rect width="1200" height="420" rx="24" fill="#f5f3ee"/>
<g font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="50" y="62" font-size="26" font-weight="700" fill="#0a1324">How a Banner job runs</text><text x="50" y="92" font-size="16" fill="#5b6478">Banner General job submission, from definition to output</text><rect x="50.0" y="130" width="199.2" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="50.0" y="130" width="199.2" height="6" rx="3" fill="#11b89b"/><circle cx="80.0" cy="172" r="17" fill="#11b89b" fill-opacity=".18"/><text x="80.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#11b89b">1</text><text x="70.0" y="222" font-size="19" font-weight="700" fill="#ffffff">Define the job</text><rect x="70.0" y="248" width="87.2" height="28" rx="14" fill="#11b89b" fill-opacity=".16"/><text x="80.0" y="267" font-size="14" font-weight="700" fill="#2ee6c5" font-family="ui-monospace, Menlo, Consolas, monospace">GJAJOBS</text><text x="70.0" y="296" font-size="14.5" fill="#9aa6c0">Name, type and</text><text x="70.0" y="317" font-size="14.5" fill="#9aa6c0">description of the</text><text x="70.0" y="338" font-size="14.5" fill="#9aa6c0">process</text><line x1="251.2" y1="250" x2="273.2" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="275.2" y="130" width="199.2" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="275.2" y="130" width="199.2" height="6" rx="3" fill="#8b7bff"/><circle cx="305.2" cy="172" r="17" fill="#8b7bff" fill-opacity=".18"/><text x="305.2" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#8b7bff">2</text><text x="295.2" y="222" font-size="19" font-weight="700" fill="#0a1324">Define parameters</text><rect x="295.2" y="248" width="87.2" height="28" rx="14" fill="#8b7bff" fill-opacity=".16"/><text x="305.2" y="267" font-size="14" font-weight="700" fill="#8b7bff" font-family="ui-monospace, Menlo, Consolas, monospace">GJAPDEF</text><text x="295.2" y="296" font-size="14.5" fill="#5b6478">Parameter numbers,</text><text x="295.2" y="317" font-size="14.5" fill="#5b6478">lengths and validation</text><line x1="476.4" y1="250" x2="498.4" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500.4" y="130" width="199.2" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="500.4" y="130" width="199.2" height="6" rx="3" fill="#ffb547"/><circle cx="530.4" cy="172" r="17" fill="#ffb547" fill-opacity=".18"/><text x="530.4" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb547">3</text><text x="520.4" y="222" font-size="19" font-weight="700" fill="#0a1324">Submit</text><rect x="520.4" y="248" width="87.2" height="28" rx="14" fill="#ffb547" fill-opacity=".16"/><text x="530.4" y="267" font-size="14" font-weight="700" fill="#ffb547" font-family="ui-monospace, Menlo, Consolas, monospace">GJAPCTL</text><text x="520.4" y="296" font-size="14.5" fill="#5b6478">Enter parameters or</text><text x="520.4" y="317" font-size="14.5" fill="#5b6478">load a saved set, pick</text><text x="520.4" y="338" font-size="14.5" fill="#5b6478">DATABASEPRINT</text><line x1="701.6" y1="250" x2="723.6" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="725.6" y="130" width="199.2" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="725.6" y="130" width="199.2" height="6" rx="3" fill="#3aa0ff"/><circle cx="755.6" cy="172" r="17" fill="#3aa0ff" fill-opacity=".18"/><text x="755.6" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#3aa0ff">4</text><text x="745.6" y="222" font-size="19" font-weight="700" fill="#0a1324">Job server runs it</text><text x="745.6" y="252" font-size="14.5" fill="#5b6478">The process executes on</text><text x="745.6" y="273" font-size="14.5" fill="#5b6478">the job submission</text><text x="745.6" y="294" font-size="14.5" fill="#5b6478">server</text><line x1="926.8" y1="250" x2="948.8" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="950.8" y="130" width="199.2" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="950.8" y="130" width="199.2" height="6" rx="3" fill="#ff6b8b"/><circle cx="980.8" cy="172" r="17" fill="#ff6b8b" fill-opacity=".18"/><text x="980.8" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ff6b8b">5</text><text x="970.8" y="222" font-size="19" font-weight="700" fill="#ffffff">Review output</text><rect x="970.8" y="248" width="87.2" height="28" rx="14" fill="#ff6b8b" fill-opacity=".16"/><text x="980.8" y="267" font-size="14" font-weight="700" fill="#2ee6c5" font-family="ui-monospace, Menlo, Consolas, monospace">GJIREVO</text><text x="970.8" y="296" font-size="14.5" fill="#9aa6c0">Read the .lis output</text><text x="970.8" y="317" font-size="14.5" fill="#9aa6c0">and .log file for</text><text x="970.8" y="338" font-size="14.5" fill="#9aa6c0">errors</text><text x="1150" y="396" text-anchor="end" font-size="13" fill="#5b6478">itcadence.com · Ellucian Banner guides</text></g>
</svg>