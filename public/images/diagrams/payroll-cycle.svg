<rect width="1200" height="420" rx="24" fill="#f5f3ee"/>
<g font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="50" y="62" font-size="26" font-weight="700" fill="#0a1324">A typical Banner payroll run</text><text x="50" y="92" font-size="16" fill="#5b6478">Run each step through job submission and check totals before moving on</text><rect x="50.0" y="130" width="161.7" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="50.0" y="130" width="161.7" height="6" rx="3" fill="#11b89b"/><circle cx="80.0" cy="172" r="17" fill="#11b89b" fill-opacity=".18"/><text x="80.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#11b89b">1</text><text x="70.0" y="222" font-size="19" font-weight="700" fill="#ffffff">Time &amp;</text><text x="70.0" y="246" font-size="19" font-weight="700" fill="#ffffff">earnings</text><text x="70.0" y="276" font-size="14.5" fill="#9aa6c0">Hours and earnings</text><text x="70.0" y="297" font-size="14.5" fill="#9aa6c0">loaded for the pay</text><text x="70.0" y="318" font-size="14.5" fill="#9aa6c0">period</text><line x1="213.7" y1="250" x2="235.7" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="237.7" y="130" width="161.7" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="237.7" y="130" width="161.7" height="6" rx="3" fill="#8b7bff"/><circle cx="267.7" cy="172" r="17" fill="#8b7bff" fill-opacity=".18"/><text x="267.7" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#8b7bff">2</text><text x="257.7" y="222" font-size="19" font-weight="700" fill="#0a1324">Calculate</text><rect x="257.7" y="248" width="87.2" height="28" rx="14" fill="#8b7bff" fill-opacity=".16"/><text x="267.7" y="267" font-size="14" font-weight="700" fill="#8b7bff" font-family="ui-monospace, Menlo, Consolas, monospace">PHPCALC</text><text x="257.7" y="296" font-size="14.5" fill="#5b6478">Gross-to-net pay,</text><text x="257.7" y="317" font-size="14.5" fill="#5b6478">deductions and</text><text x="257.7" y="338" font-size="14.5" fill="#5b6478">taxes</text><line x1="401.3" y1="250" x2="423.3" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="425.3" y="130" width="161.7" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="425.3" y="130" width="161.7" height="6" rx="3" fill="#ffb547"/><circle cx="455.3" cy="172" r="17" fill="#ffb547" fill-opacity=".18"/><text x="455.3" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb547">3</text><text x="445.3" y="222" font-size="19" font-weight="700" fill="#0a1324">Review &amp;</text><text x="445.3" y="246" font-size="19" font-weight="700" fill="#0a1324">number</text><text x="445.3" y="276" font-size="14.5" fill="#5b6478">Check exceptions,</text><text x="445.3" y="297" font-size="14.5" fill="#5b6478">assign document</text><text x="445.3" y="318" font-size="14.5" fill="#5b6478">numbers</text><line x1="589.0" y1="250" x2="611.0" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="613.0" y="130" width="161.7" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="613.0" y="130" width="161.7" height="6" rx="3" fill="#3aa0ff"/><circle cx="643.0" cy="172" r="17" fill="#3aa0ff" fill-opacity=".18"/><text x="643.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#3aa0ff">4</text><text x="633.0" y="222" font-size="19" font-weight="700" fill="#0a1324">Pay</text><rect x="633.0" y="248" width="87.2" height="28" rx="14" fill="#3aa0ff" fill-opacity=".16"/><text x="643.0" y="267" font-size="14" font-weight="700" fill="#3aa0ff" font-family="ui-monospace, Menlo, Consolas, monospace">PHPCHEK</text><text x="633.0" y="296" font-size="14.5" fill="#5b6478">Cheques, plus</text><text x="633.0" y="317" font-size="14.5" fill="#5b6478">direct deposit</text><text x="633.0" y="338" font-size="14.5" fill="#5b6478">files via PHPDIRD</text><line x1="776.7" y1="250" x2="798.7" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="800.7" y="130" width="161.7" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="800.7" y="130" width="161.7" height="6" rx="3" fill="#ff6b8b"/><circle cx="830.7" cy="172" r="17" fill="#ff6b8b" fill-opacity=".18"/><text x="830.7" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ff6b8b">5</text><text x="820.7" y="222" font-size="19" font-weight="700" fill="#0a1324">Update</text><rect x="820.7" y="248" width="87.2" height="28" rx="14" fill="#ff6b8b" fill-opacity=".16"/><text x="830.7" y="267" font-size="14" font-weight="700" fill="#ff6b8b" font-family="ui-monospace, Menlo, Consolas, monospace">PHPUPDT</text><text x="820.7" y="296" font-size="14.5" fill="#5b6478">Write results to</text><text x="820.7" y="317" font-size="14.5" fill="#5b6478">employee history</text><line x1="964.3" y1="250" x2="986.3" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="988.3" y="130" width="161.7" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="988.3" y="130" width="161.7" height="6" rx="3" fill="#11b89b"/><circle cx="1018.3" cy="172" r="17" fill="#11b89b" fill-opacity=".18"/><text x="1018.3" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#11b89b">6</text><text x="1008.3" y="222" font-size="19" font-weight="700" fill="#ffffff">Finance feed</text><rect x="1008.3" y="248" width="87.2" height="28" rx="14" fill="#11b89b" fill-opacity=".16"/><text x="1018.3" y="267" font-size="14" font-weight="700" fill="#2ee6c5" font-family="ui-monospace, Menlo, Consolas, monospace">PHPFEED</text><text x="1008.3" y="296" font-size="14.5" fill="#9aa6c0">Post expense to</text><text x="1008.3" y="317" font-size="14.5" fill="#9aa6c0">Banner Finance by</text><text x="1008.3" y="338" font-size="14.5" fill="#9aa6c0">FOAPAL</text><text x="1150" y="396" text-anchor="end" font-size="13" fill="#5b6478">itcadence.com · Ellucian Banner guides</text></g>
