<g font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="50" y="62" font-size="26" font-weight="700" fill="#0a1324">Population selection in Banner</text><text x="50" y="92" font-size="16" fill="#5b6478">Application + selection ID + creator ID identify each population</text><rect x="50.0" y="130" width="255.5" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="50.0" y="130" width="255.5" height="6" rx="3" fill="#11b89b"/><circle cx="80.0" cy="172" r="17" fill="#11b89b" fill-opacity=".18"/><text x="80.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#11b89b">1</text><text x="70.0" y="222" font-size="19" font-weight="700" fill="#ffffff">Write the rules</text><rect x="70.0" y="248" width="87.2" height="28" rx="14" fill="#11b89b" fill-opacity=".16"/><text x="80.0" y="267" font-size="14" font-weight="700" fill="#2ee6c5" font-family="ui-monospace, Menlo, Consolas, monospace">GLRSLCT</text><text x="70.0" y="296" font-size="14.5" fill="#9aa6c0">Conditions that describe who</text><text x="70.0" y="317" font-size="14.5" fill="#9aa6c0">belongs in the list</text><line x1="307.5" y1="250" x2="329.5" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="331.5" y="130" width="255.5" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="331.5" y="130" width="255.5" height="6" rx="3" fill="#8b7bff"/><circle cx="361.5" cy="172" r="17" fill="#8b7bff" fill-opacity=".18"/><text x="361.5" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#8b7bff">2</text><text x="351.5" y="222" font-size="19" font-weight="700" fill="#0a1324">Extract</text><rect x="351.5" y="248" width="87.2" height="28" rx="14" fill="#8b7bff" fill-opacity=".16"/><text x="361.5" y="267" font-size="14" font-weight="700" fill="#8b7bff" font-family="ui-monospace, Menlo, Consolas, monospace">GLBDATA</text><text x="351.5" y="296" font-size="14.5" fill="#5b6478">Run the rules and store the</text><text x="351.5" y="317" font-size="14.5" fill="#5b6478">resulting people</text><line x1="589.0" y1="250" x2="611.0" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="613.0" y="130" width="255.5" height="240" rx="18" fill="#ffffff" stroke="#d9d5cc"/><rect x="613.0" y="130" width="255.5" height="6" rx="3" fill="#ffb547"/><circle cx="643.0" cy="172" r="17" fill="#ffb547" fill-opacity=".18"/><text x="643.0" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb547">3</text><text x="633.0" y="222" font-size="19" font-weight="700" fill="#0a1324">Review and adjust</text><rect x="633.0" y="248" width="87.2" height="28" rx="14" fill="#ffb547" fill-opacity=".16"/><text x="643.0" y="267" font-size="14" font-weight="700" fill="#ffb547" font-family="ui-monospace, Menlo, Consolas, monospace">GLAEXTR</text><text x="633.0" y="296" font-size="14.5" fill="#5b6478">Add or remove people; inquire</text><text x="633.0" y="317" font-size="14.5" fill="#5b6478">on GLIEXTR</text><line x1="870.5" y1="250" x2="892.5" y2="250" stroke="#11b89b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="894.5" y="130" width="255.5" height="240" rx="18" fill="url(#core)" stroke="none"/><rect x="894.5" y="130" width="255.5" height="6" rx="3" fill="#3aa0ff"/><circle cx="924.5" cy="172" r="17" fill="#3aa0ff" fill-opacity=".18"/><text x="924.5" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#3aa0ff">4</text><text x="914.5" y="222" font-size="19" font-weight="700" fill="#ffffff">Use it</text><text x="914.5" y="252" font-size="14.5" fill="#9aa6c0">Letters, holds, time tickets</text><text x="914.5" y="273" font-size="14.5" fill="#9aa6c0">and batch jobs</text><text x="1150" y="396" text-anchor="end" font-size="13" fill="#5b6478">itcadence.com · Ellucian Banner guides</text></g>
